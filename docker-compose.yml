# Local dev lake: Postgres (app DB + Iceberg JDBC catalog) + MinIO (S3 warehouse) + Trino (Iceberg).
#   docker compose up -d
# Trino http://localhost:8080 (catalog "lake") | MinIO console http://localhost:9001 (minioadmin / minioadmin)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sl
      POSTGRES_PASSWORD: sl
      POSTGRES_DB: semantic_layer
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro   # creates the "iceberg" catalog DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sl -d semantic_layer"]
      interval: 5s
      timeout: 4s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 4s
      retries: 10

  minio-init:                    # creates the warehouse bucket, then exits
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/warehouse"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  trino:
    image: trinodb/trino:latest
    ports: ["8080:8080"]
    volumes:
      - ./dev/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'select 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  miniodata:
